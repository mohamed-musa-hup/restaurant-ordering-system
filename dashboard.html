<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Dashboard | FoodieHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; }
        .sidebar {
            position: fixed; left: 0; top: 0; width: 280px; height: 100%;
            background: linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%);
            color: white; padding: 25px 20px; z-index: 100;
        }
        .sidebar h3 { font-size: 22px; margin-bottom: 30px; text-align: center; border-bottom: 2px solid #ee5a24; padding-bottom: 10px; }
        .sidebar .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px; margin: 8px 0;
            border-radius: 12px; cursor: pointer; transition: all 0.3s; color: rgba(255,255,255,0.8);
        }
        .sidebar .nav-item:hover, .sidebar .nav-item.active { background: #ee5a24; color: white; }
        .main-content { margin-left: 280px; padding: 20px 30px; }
        .product-card {
            background: white; border-radius: 16px; padding: 15px; margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: all 0.2s;
        }
        .product-card:hover { transform: translateY(-3px); }
        .product-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; }
        .category-badge { background: #e9ecef; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #2c3e50; display: inline-block; margin: 3px; }
        .offer-banner { background: linear-gradient(120deg, #ff6b6b, #ee5a24); border-radius: 16px; padding: 20px; margin-bottom: 25px; color: white; }
        .modal-content { border-radius: 20px; }
        .preview-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .preview-frame {
            width: 100%;
            height: 500px;
            border-radius: 12px;
            border: 1px solid #ddd;
            margin-top: 15px;
        }
        .copy-btn {
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            color: #ee5a24;
        }
        @media (max-width: 768px) {
            .sidebar { width: 70px; padding: 15px 10px; }
            .sidebar span, .sidebar h3 { display: none; }
            .sidebar .nav-item { justify-content: center; }
            .main-content { margin-left: 70px; }
        }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #fff; border-radius: 50%; border-top-color: transparent; animation: spin 0.6s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>🍽️ FoodieHub</h3>
        <div class="nav-item active" data-tab="products"><i class="fas fa-utensils fa-lg"></i> <span>Products</span></div>
        <div class="nav-item" data-tab="offers"><i class="fas fa-tags fa-lg"></i> <span>Offer</span></div>
        <div class="nav-item" data-tab="categories"><i class="fas fa-list fa-lg"></i> <span>Categories</span></div>
        <div class="nav-item" data-tab="settings"><i class="fas fa-cog fa-lg"></i> <span>Settings</span></div>
        <div class="nav-item" data-tab="preview"><i class="fas fa-eye fa-lg"></i> <span>Preview</span></div>
        <div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt fa-lg"></i> <span>Logout</span></div>
    </div>

    <div class="main-content">
        <!-- Products Tab -->
        <div id="productsTab" class="tab-content active">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-utensils"></i> Menu Products</h2>
                <button class="btn btn-primary" onclick="openAddProductModal()"><i class="fas fa-plus"></i> Add Product</button>
            </div>
            <div id="productsList" class="row"></div>
        </div>

        <!-- Offers Tab -->
        <div id="offersTab" class="tab-content" style="display:none;">
            <h2><i class="fas fa-tags"></i> Active Offer</h2>
            <div id="currentOffer" class="offer-banner mt-3"></div>
            <button class="btn btn-warning mt-3" onclick="openOfferModal()"><i class="fas fa-edit"></i> Edit Offer</button>
        </div>

        <!-- Categories Tab -->
        <div id="categoriesTab" class="tab-content" style="display:none;">
            <h2><i class="fas fa-list"></i> Categories</h2>
            <div id="categoriesList" class="mt-3"></div>
            <button class="btn btn-primary mt-3" onclick="openCategoryModal()"><i class="fas fa-plus"></i> Add Category</button>
        </div>

        <!-- Settings Tab -->
        <div id="settingsTab" class="tab-content" style="display:none;">
            <h2><i class="fas fa-cog"></i> Restaurant Settings</h2>
            <form id="settingsForm" class="mt-4">
                <div class="row">
                    <div class="col-md-6 mb-3"><label>Restaurant Name</label><input type="text" class="form-control" id="setting_restaurant_name"></div>
                    <div class="col-md-6 mb-3"><label>Phone Number</label><input type="text" class="form-control" id="setting_phone"></div>
                    <div class="col-md-6 mb-3"><label>WhatsApp Number</label><input type="text" class="form-control" id="setting_whatsapp"></div>
                    <div class="col-md-6 mb-3"><label>Currency</label><select class="form-control" id="setting_currency"><option value="AED">AED</option><option value="SAR">SAR</option><option value="EGP">EGP</option><option value="USD">USD</option></select></div>
                    <div class="col-12 mb-3"><label>Address</label><textarea class="form-control" id="setting_address" rows="2"></textarea></div>
                    <div class="col-12 mb-3"><label>Map URL</label><input type="text" class="form-control" id="setting_map_url" placeholder="https://www.google.com/maps/embed?pb=..."></div>
                </div>
                <button type="submit" class="btn btn-primary">Save Settings</button>
            </form>
        </div>

        <!-- Preview Tab -->
        <div id="previewTab" class="tab-content" style="display:none;">
            <h2><i class="fas fa-eye"></i> Restaurant Preview</h2>
            <div class="preview-card">
                <p>This is how your restaurant appears to customers. Share this link to start receiving orders!</p>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="previewUrl" readonly>
                    <button class="btn btn-outline-secondary copy-btn" onclick="copyPreviewUrl()">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                    <button class="btn btn-info" onclick="openPreview()">
                        <i class="fas fa-external-link-alt"></i> Open
                    </button>
                </div>
                <iframe id="previewFrame" class="preview-frame" title="Restaurant Preview"></iframe>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg"><div class="modal-content">
            <div class="modal-header bg-primary text-white"><h5 class="modal-title" id="productModalTitle">Add Product</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="product_id">
                <div class="row">
                    <div class="col-md-6 mb-3"><label>Product Name *</label><input type="text" class="form-control" id="product_name"></div>
                    <div class="col-md-6 mb-3"><label>Price *</label><input type="number" step="0.01" class="form-control" id="product_price"></div>
                    <div class="col-md-6 mb-3"><label>Category</label><select class="form-control" id="product_category"><option value="">Select...</option></select><input type="text" class="form-control mt-2" id="new_category" placeholder="Or create new"></div>
                    <div class="col-md-6 mb-3"><label>Type</label><select class="form-control" id="product_type"><option value="simple">Simple</option><option value="variable">Variable</option></select></div>
                    <div class="col-md-12 mb-3" id="optionsContainer" style="display:none;"><label>Options (JSON)</label><textarea class="form-control" id="product_options" rows="2" placeholder='{"Small":0,"Large":5}'></textarea></div>
                    <div class="col-md-12 mb-3"><label>Image URL</label><input type="text" class="form-control" id="product_image" placeholder="https://picsum.photos/300/200"></div>
                </div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary" onclick="saveProduct()">Save Product</button></div>
        </div></div>
    </div>

    <!-- Offer Modal -->
    <div class="modal fade" id="offerModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-header bg-warning"><h5 class="modal-title">Special Offer</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label>Title *</label><input type="text" class="form-control" id="offer_name"></div>
                <div class="mb-3"><label>Offer Price *</label><input type="number" step="0.01" class="form-control" id="offer_price"></div>
                <div class="mb-3"><label>Original Price</label><input type="number" step="0.01" class="form-control" id="offer_old_price"></div>
                <div class="mb-3"><label>Expiry Date *</label><input type="date" class="form-control" id="offer_expiry"></div>
                <div class="mb-3"><label>Image URL</label><input type="text" class="form-control" id="offer_image"></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-danger" onclick="deleteOffer()">Delete</button><button type="button" class="btn btn-primary" onclick="saveOffer()">Save</button></div>
        </div></div>
    </div>

    <!-- Category Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-header bg-primary text-white"><h5 class="modal-title">Add Category</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body"><input type="text" class="form-control" id="newCategoryName" placeholder="Category name"></div>
            <div class="modal-footer"><button type="button" class="btn btn-primary" onclick="addNewCategory()">Add</button></div>
        </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ==================== CONFIG ====================
        const API_URL = 'https://script.google.com/macros/s/AKfycbxQgPqZO5bzTjTvA4yDDa0XG_qWW40aauiMkAyrJsvtNn5cLkHPdIDWToHaOcwdM4mnyg/exec';
        
        let restaurantId = localStorage.getItem('restaurant_id');
        let currency = localStorage.getItem('currency') || 'AED';
        let products = [];
        let categories = [];

        if (!restaurantId) window.location.href = 'login.html';

        // ==================== API ====================
        async function callAPI(action, data = {}) {
            const params = new URLSearchParams({ action: action, restaurant_id: restaurantId, ...data });
            const response = await fetch(`${API_URL}?${params.toString()}`);
            return await response.json();
        }

        // ==================== LOAD ====================
        async function loadProducts() {
            const result = await callAPI('getMenu');
            if (result.success) { products = result.data || []; renderProducts(); }
        }

        async function loadCategories() {
            const result = await callAPI('getCategories');
            if (result.success) { categories = (result.data || []).filter(c => c !== 'all'); renderCategories(); updateCategorySelect(); }
        }

        async function loadOffer() {
            const result = await callAPI('getOffer');
            const container = document.getElementById('currentOffer');
            if (result.success && result.data && result.data.name) {
                container.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center flex-wrap">
                        <div>
                            <h3 class="mb-1">🎉 ${escapeHtml(result.data.name)}</h3>
                            <p class="mb-0">
                                <span class="fs-3 fw-bold">${result.data.offer_price} ${currency}</span>
                                ${result.data.old_price ? `<span class="text-decoration-line-through ms-2">${result.data.old_price} ${currency}</span>` : ''}
                                <br><small>Expires: ${result.data.expiry_date}</small>
                            </p>
                        </div>
                        ${result.data.image ? `<img src="${result.data.image}" style="height:80px; width:80px; object-fit:cover; border-radius:12px;" onerror="this.src='https://via.placeholder.com/80'">` : ''}
                    </div>
                `;
            } else {
                container.innerHTML = '<p>No active offer. Click "Edit Offer" to create one!</p>';
            }
        }

        async function loadSettings() {
            const result = await callAPI('getRestaurantInfo');
            if (result.success) {
                document.getElementById('setting_restaurant_name').value = result.data.app_name || '';
                document.getElementById('setting_phone').value = result.data.phone || '';
                document.getElementById('setting_whatsapp').value = result.data.whatsapp || '';
                document.getElementById('setting_currency').value = result.data.currency || 'AED';
                document.getElementById('setting_address').value = result.data.address || '';
                document.getElementById('setting_map_url').value = result.data.map_url || '';
                currency = result.data.currency || 'AED';
            }
        }

        // ==================== RENDER ====================
        function renderProducts() {
            const container = document.getElementById('productsList');
            if (!products.length) { container.innerHTML = '<div class="col-12 text-center py-5"><i class="fas fa-box-open fa-3x text-muted"></i><p>No products yet</p></div>'; return; }
            container.innerHTML = products.map(p => `
                <div class="col-md-6 col-lg-4">
                    <div class="product-card"><div class="d-flex gap-3">
                        <img src="${p.image || 'https://via.placeholder.com/60'}" onerror="this.src='https://via.placeholder.com/60'">
                        <div><h6>${escapeHtml(p.name)}</h6><span class="category-badge">${escapeHtml(p.category) || 'Uncategorized'}</span><div><strong>${Number(p.price).toFixed(2)} ${currency}</strong></div></div>
                        <div><button class="btn btn-sm btn-outline-primary" onclick='editProduct(${JSON.stringify(p)})'><i class="fas fa-edit"></i></button><button class="btn btn-sm btn-outline-danger mt-1" onclick='deleteProduct(${p.id})'><i class="fas fa-trash"></i></button></div>
                    </div></div>
                </div>`).join('');
        }

        function renderCategories() {
            const container = document.getElementById('categoriesList');
            container.innerHTML = categories.length ? categories.map(c => `<span class="category-badge">${escapeHtml(c)}</span>`).join('') : '<p>No categories yet</p>';
        }

        function updateCategorySelect() {
            const select = document.getElementById('product_category');
            select.innerHTML = '<option value="">Select...</option>' + categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ==================== PRODUCT ====================
        function openAddProductModal() {
            document.getElementById('product_id').value = '';
            document.getElementById('product_name').value = '';
            document.getElementById('product_price').value = '';
            document.getElementById('product_category').value = '';
            document.getElementById('new_category').value = '';
            document.getElementById('product_type').value = 'simple';
            document.getElementById('product_image').value = '';
            document.getElementById('optionsContainer').style.display = 'none';
            document.getElementById('productModalTitle').innerText = 'Add Product';
            new bootstrap.Modal(document.getElementById('productModal')).show();
        }

        function editProduct(product) {
            document.getElementById('product_id').value = product.id;
            document.getElementById('product_name').value = product.name;
            document.getElementById('product_price').value = product.price;
            document.getElementById('product_category').value = product.category || '';
            document.getElementById('product_image').value = product.image || '';
            const hasOptions = product.options && Object.keys(product.options).length > 0 && Object.keys(product.options)[0] !== 'Regular';
            document.getElementById('product_type').value = hasOptions ? 'variable' : 'simple';
            if (hasOptions) {
                document.getElementById('optionsContainer').style.display = 'block';
                document.getElementById('product_options').value = JSON.stringify(product.options, null, 2);
            } else {
                document.getElementById('optionsContainer').style.display = 'none';
            }
            document.getElementById('productModalTitle').innerText = 'Edit Product';
            new bootstrap.Modal(document.getElementById('productModal')).show();
        }

        async function saveProduct() {
            const btn = document.querySelector('#productModal .btn-primary');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="loading-spinner"></span>Saving...';
            btn.disabled = true;
            
            try {
                const id = document.getElementById('product_id').value;
                let category = document.getElementById('product_category').value;
                const newCat = document.getElementById('new_category').value.trim();
                if (newCat) category = newCat;
                
                let options = {};
                if (document.getElementById('product_type').value === 'variable') {
                    try { options = JSON.parse(document.getElementById('product_options').value || '{}'); } catch(e) { options = {}; }
                }
                
                const data = {
                    name: document.getElementById('product_name').value,
                    price: parseFloat(document.getElementById('product_price').value),
                    category: category || 'Uncategorized',
                    options: JSON.stringify(options),
                    image_url: document.getElementById('product_image').value || 'https://via.placeholder.com/300'
                };
                
                let result;
                if (id) { result = await callAPI('updateProduct', { product_id: id, ...data }); }
                else { result = await callAPI('addProduct', data); }
                
                if (result.success) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('productModal'));
                    modal.hide();
                    document.querySelectorAll('.modal-backdrop').forEach(b => b.remove());
                    document.body.classList.remove('modal-open');
                    await loadProducts();
                    await loadCategories();
                    Swal.fire('Success', `Product ${id ? 'updated' : 'added'}!`, 'success');
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            } catch(e) { Swal.fire('Error', e.message, 'error'); }
            finally { btn.innerHTML = originalHtml; btn.disabled = false; }
        }

        async function deleteProduct(id) {
            const confirm = await Swal.fire({ title: 'Delete?', text: 'This cannot be undone!', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Delete' });
            if (confirm.isConfirmed) {
                const result = await callAPI('deleteProduct', { product_id: id });
                if (result.success) { await loadProducts(); await loadCategories(); Swal.fire('Deleted!', '', 'success'); }
                else { Swal.fire('Error', result.message, 'error'); }
            }
        }

        // ==================== OFFER ====================
        function openOfferModal() {
            document.getElementById('offer_name').value = '';
            document.getElementById('offer_price').value = '';
            document.getElementById('offer_old_price').value = '';
            document.getElementById('offer_image').value = '';
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 30);
            document.getElementById('offer_expiry').value = tomorrow.toISOString().split('T')[0];
            
            loadOfferIntoModal();
            new bootstrap.Modal(document.getElementById('offerModal')).show();
        }

        async function loadOfferIntoModal() {
            const result = await callAPI('getOffer');
            if (result.success && result.data && result.data.name) {
                document.getElementById('offer_name').value = result.data.name || '';
                document.getElementById('offer_price').value = result.data.offer_price || '';
                document.getElementById('offer_old_price').value = result.data.old_price || '';
                document.getElementById('offer_expiry').value = result.data.expiry_date || '';
                document.getElementById('offer_image').value = result.data.image || '';
            }
        }

        async function saveOffer() {
            const btn = document.querySelector('#offerModal .btn-primary');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="loading-spinner"></span>Saving...';
            btn.disabled = true;
            
            try {
                const name = document.getElementById('offer_name').value;
                const offerPrice = parseFloat(document.getElementById('offer_price').value);
                const expiryDate = document.getElementById('offer_expiry').value;
                
                if (!name || isNaN(offerPrice) || !expiryDate) {
                    Swal.fire('Error', 'Please fill all required fields', 'error');
                    return;
                }
                
                const data = {
                    name: name,
                    offer_price: offerPrice,
                    old_price: document.getElementById('offer_old_price').value ? parseFloat(document.getElementById('offer_old_price').value) : null,
                    expiry_date: expiryDate,
                    image: document.getElementById('offer_image').value || ''
                };
                
                const result = await callAPI('addOffer', data);
                
                if (result.success) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('offerModal'));
                    modal.hide();
                    document.querySelectorAll('.modal-backdrop').forEach(b => b.remove());
                    document.body.classList.remove('modal-open');
                    await loadOffer();
                    Swal.fire('Success', 'Offer saved successfully!', 'success');
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            } catch(e) {
                Swal.fire('Error', e.message, 'error');
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        async function deleteOffer() {
            const confirm = await Swal.fire({ title: 'Delete offer?', text: 'This cannot be undone!', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Delete' });
            if (confirm.isConfirmed) {
                const result = await callAPI('deleteOffer');
                if (result.success) { await loadOffer(); Swal.fire('Deleted!', '', 'success'); }
                else { Swal.fire('Error', result.message, 'error'); }
            }
        }

        // ==================== CATEGORY ====================
        function openCategoryModal() { new bootstrap.Modal(document.getElementById('categoryModal')).show(); }
        async function addNewCategory() {
            const name = document.getElementById('newCategoryName').value.trim();
            if (!name) { Swal.fire('Error', 'Enter category name', 'error'); return; }
            const result = await callAPI('addCategory', { category_name: name });
            if (result.success) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('categoryModal'));
                modal.hide();
                await loadCategories();
                Swal.fire('Success', 'Category added!', 'success');
            } else { Swal.fire('Error', result.message, 'error'); }
        }

        // ==================== SETTINGS ====================
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const original = btn.innerHTML;
            btn.innerHTML = '<span class="loading-spinner"></span>Saving...';
            btn.disabled = true;
            try {
                const data = {
                    app_name: document.getElementById('setting_restaurant_name').value,
                    phone: document.getElementById('setting_phone').value,
                    whatsapp: document.getElementById('setting_whatsapp').value,
                    currency: document.getElementById('setting_currency').value,
                    address: document.getElementById('setting_address').value,
                    map_url: document.getElementById('setting_map_url').value
                };
                const result = await callAPI('updateSettings', data);
                if (result.success) { 
                    Swal.fire('Success', 'Settings updated!', 'success'); 
                    currency = data.currency; 
                    localStorage.setItem('currency', currency);
                    updatePreviewUrl();
                }
                else { Swal.fire('Error', result.message, 'error'); }
            } catch(e) { Swal.fire('Error', e.message, 'error'); }
            finally { btn.innerHTML = original; btn.disabled = false; }
        });

        // ==================== PREVIEW ====================
        function updatePreviewUrl() {
            const baseUrl = window.location.origin + window.location.pathname.replace('dashboard.html', 'customer.html');
            const previewUrl = `${baseUrl}?restaurant_id=${restaurantId}`;
            const urlInput = document.getElementById('previewUrl');
            if (urlInput) {
                urlInput.value = previewUrl;
            }
            const frame = document.getElementById('previewFrame');
            if (frame) {
                frame.src = previewUrl;
            }
        }

        function copyPreviewUrl() {
            const urlInput = document.getElementById('previewUrl');
            if (urlInput) {
                urlInput.select();
                document.execCommand('copy');
                Swal.fire('Copied!', 'Preview link copied to clipboard', 'success');
            }
        }

        function openPreview() {
            const urlInput = document.getElementById('previewUrl');
            if (urlInput && urlInput.value) {
                window.open(urlInput.value, '_blank');
            }
        }

        // ==================== NAVIGATION ====================
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                if (item.id === 'logoutBtn') { localStorage.clear(); window.location.href = 'login.html'; return; }
                const tab = item.dataset.tab;
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
                document.getElementById(`${tab}Tab`).style.display = 'block';
                if (tab === 'products') loadProducts();
                if (tab === 'offers') loadOffer();
                if (tab === 'categories') loadCategories();
                if (tab === 'settings') loadSettings();
                if (tab === 'preview') updatePreviewUrl();
            });
        });

        document.getElementById('product_type').addEventListener('change', (e) => {
            document.getElementById('optionsContainer').style.display = e.target.value === 'variable' ? 'block' : 'none';
        });

        // ==================== INIT ====================
        loadProducts(); loadCategories(); loadOffer(); loadSettings();
    </script>
</body>
</html>
