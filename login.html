<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Login | FoodieHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            padding: 35px 30px;
            text-align: center;
        }

        .card-header h2 {
            color: white;
            margin: 0;
            font-weight: 700;
            font-size: 28px;
        }

        .card-header p {
            color: rgba(255, 255, 255, 0.9);
            margin-top: 8px;
            font-size: 14px;
        }

        .card-body {
            padding: 40px;
        }

        .form-label {
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-label i {
            color: #ee5a24;
            margin-right: 6px;
        }

        .form-control {
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #ee5a24;
            box-shadow: 0 0 0 4px rgba(238, 90, 36, 0.1);
        }

        .btn-login {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(238, 90, 36, 0.3);
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e1e8ed;
        }

        .register-link a {
            color: #ee5a24;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin-top: 20px;
            font-size: 12px;
            text-align: center;
            color: #6c757d;
        }

        @media (max-width: 576px) {
            .card-body {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card-header">
            <h2>🔐 Restaurant Login</h2>
            <p>Access your restaurant dashboard</p>
        </div>
        <div class="card-body">
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" class="form-control" id="email" 
                           placeholder="restaurant@example.com" required>
                    <small class="text-muted" style="font-size: 12px;">Enter the email you registered with</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" class="form-control" id="password" 
                           placeholder="Your password" required>
                    <small class="text-muted" style="font-size: 12px;">Enter your account password</small>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>

                <div class="register-link">
                    Don't have an account? <a href="register.html">Register here</a>
                </div>

                <div class="demo-credentials">
                    <i class="fas fa-info-circle"></i> Demo: test@example.com / 123456
                </div>
            </form>
        </div>
    </div>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxQgPqZO5bzTjTvA4yDDa0XG_qWW40aauiMkAyrJsvtNn5cLkHPdIDWToHaOcwdM4mnyg/exec';
        
        // Check if user is already logged in
        if (localStorage.getItem('restaurant_id')) {
            window.location.href = 'dashboard.html';
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Show loading state
            const submitBtn = document.querySelector('.btn-login');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_URL}?action=login&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`);
                const result = await response.json();
                
                if (result.success) {
                    // Save restaurant data to localStorage
                    localStorage.setItem('restaurant_id', result.data.restaurant_id);
                    localStorage.setItem('restaurant_email', result.data.email);
                    localStorage.setItem('restaurant_name', result.data.restaurant_name);
                    localStorage.setItem('currency', result.data.currency);
                    
                    Swal.fire({
                        title: '🎉 Welcome Back!',
                        text: `Logged in as ${result.data.restaurant_name}`,
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = 'dashboard.html';
                    });
                } else {
                    Swal.fire({
                        title: '❌ Login Failed',
                        text: result.message,
                        icon: 'error',
                        confirmButtonColor: '#ee5a24'
                    });
                }
            } catch(error) {
                Swal.fire({
                    title: '❌ Connection Error',
                    text: 'Unable to connect to server. Please try again.',
                    icon: 'error',
                    confirmButtonColor: '#ee5a24'
                });
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
