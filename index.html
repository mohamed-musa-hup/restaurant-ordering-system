<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub | Restaurant Ordering System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .landing-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
        }
        .btn-primary { background: linear-gradient(135deg, #ff6b6b, #ee5a24); border: none; }
        .btn-outline-primary { border-color: #ee5a24; color: #ee5a24; }
        .btn-outline-primary:hover { background: #ee5a24; color: white; }
    </style>
</head>
<body>
    <div class="landing-card">
        <div class="logo">🍽️</div>
        <h1>FoodieHub</h1>
        <p>Complete Restaurant Ordering System</p>
        <div class="btn-group">
            <a href="login.html" class="btn btn-primary">Restaurant Login</a>
            <a href="register.html" class="btn btn-outline-primary">Register Restaurant</a>
        </div>
        <hr class="my-4">
        <small class="text-muted">Powered by Google Sheets & Apps Script</small>
    </div>
</body>
</html>
